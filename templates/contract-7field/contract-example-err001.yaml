# YAML 契约完整示例：ERR-001「错误状态后果差异未分级」

> 配套模板：[YAML 契约模板（7 字段，冻结 v1.0.0）](https://www.yuque.com/u222739/why7ts/cby8rkiahhfio0cb)
> 交付件路径：`templates/contract-7field/contract-example-err001.yaml`
> 存档编号：ERR-001（漂移模式示例：LLM 生成告警/错误文案时，Critical 被同义词降级为"严重"）

---

## 契约原文

```yaml
# 完整示例：ERR-001 错误分级契约（对应漂移模式 ERR-001 后果差异未分级）
# 漂移现场：LLM 生成告警/错误文案时，Critical 被同义词降级为"严重"

intent_id: contract.err001.error_severity
description: 错误状态必须按用户后果分级表达，禁止同义词降级
version: 1.0.0
semantic_domain: feedback.error_state
applicable_products: [ai_assistant, web_console]

semantic_tokens:
  error_severity:
    fatal:                # 已注册：用户数据/进度损失，必须立即处理
      description: 不可恢复，用户必须立即处理
      visual_mapping: { color_token: "color.feedback.fatal", motion_token: "motion.none", icon_token: "icon.error.blocking" }
      user_action: 提供损失补救路径（如导出已编辑内容）
    transient:            # 已注册：稍候自动恢复，无需用户操作
      description: 暂时性故障，稍后自动恢复
      visual_mapping: { color_token: "color.feedback.transient", motion_token: "motion.pulse", icon_token: "icon.error.passive" }
      user_action: 告知等待时长，禁止弹窗阻断
    retryable:            # 已注册：操作失败，用户重试可成功
      description: 操作未完成，用户重试即可
      visual_mapping: { color_token: "color.feedback.retryable", motion_token: "motion.none", icon_token: "icon.error.action" }
      user_action: 提供一键重试
    degraded:             # 已注册：功能降格可用，核心路径不断
      description: 部分功能暂不可用，其余正常
      visual_mapping: { color_token: "color.feedback.degraded", motion_token: "motion.none", icon_token: "icon.error.degraded" }
      user_action: 说明受影响范围

immutable_boundaries:
  - 禁止将 fatal 级状态以"出了点小问题""稍后再试"等中性/降级文案表达
  - 禁止跨层绑定：fatal 不得使用成功态或提示态的颜色、图标、动效
  - 禁止缺少 user_action 的错误状态（机器无法回答"用户该做什么"即违规）
  - 禁止在同一份界面中混用两个 severity 令牌的视觉映射
```

## 逐字段注记（评审时看什么）

| 字段 | 内容 | 合格线的依据 |
| --- | --- | --- |
| `intent_id` | `contract.err001.error_severity` | 全局唯一、命名可读，关联漂移模式编号 ERR-001，可被模式卡片、快照、CI 报错引用 |
| `description` | "错误状态必须按用户后果分级表达，禁止同义词降级" | 一句话说清"管什么、为什么"，从真实漂移案例来（Critical → 严重的同义词降级现场） |
| `version` | `1.0.0` | 初始版；版本纪律：语义不变更 patch / 令牌增删更 minor / 边界变化更 major |
| `semantic_domain` | `feedback.error_state` | 一个契约只管一个语义域；错误反馈域已登记 |
| `applicable_products` | `[ai_assistant, web_console]` | 宁窄勿宽——从最高频高危的两个产品开始，不做全域宣言 |
| `semantic_tokens` | 四级令牌 `error_severity: fatal / transient / retryable / degraded`，每级带 description、visual_mapping、user_action | 四个令牌均 registered，全部来自语义字典，零自创——这是最严的一条硬要求 |
| `immutable_boundaries` | 四条负向约束，全部是"禁止"型 | 每条可机器判定，无"尽量/建议"类措辞；覆盖文案降级、跨层绑定、缺 user_action、混用映射四类违规 |

## 这条契约管什么模式

**ERR-001（错误状态后果差异未分级）**：四个后果天壤之别的错误状态，在 LLM 眼里是同一个模糊槽位——它只有"词频统计"，没有"后果权重"。`"Error in message stream"`（用户数据/进度损失，fatal）和 `"network error"`（会自动恢复，transient）被同等表达，用户唯一的信号就是"出了点小问题"。

修复路径：四级令牌的视觉映射与 `user_action` 与级别绑定，写进契约后编译成四种产物——Prompt 前缀防止生成降级、JSON Schema 拦截 `blocked` 单布尔、Checklist 供走查、CI 规则在提交时拦住致命降级文案。

## 流动说明

这份契约的出生证明是 ERR-001 模式卡片（由快照证据链归档）。评审时的三个硬要求对应核查：格式（7 字段完整）、语义（四个令牌均 registered）、证据（关联模式卡片 ERR-001 及其快照证据链）。评审通过不等于规则生效——它还要被编译、被消费、被追踪；消费率长期为零的契约是沉睡规则。
